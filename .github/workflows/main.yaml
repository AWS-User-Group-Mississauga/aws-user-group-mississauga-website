name: Validate & Deploy Website

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches:
      - main

  push:
    branches:
      - main
    
defaults:
  run:
    working-directory: ./infra

permissions:
  id-token: write
  contents: read

jobs:
  #validate infra on PR opened/sync
  validate-pr:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        
      - name: 'Configure AWS creds'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_PREVIEW_ROLE_ARN }}
          aws-region: 'ca-central-1'
        
      - name: 'Set up Node'
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json
      
      - name: 'Install dependencies'
        run: |
          npm ci
      
      - name: 'Validate stack'
        run: |
          npx cdk synth -c prNumber=${{ github.event.pull_request.number}}
          
              
      - name: 'Security Scan with AI SSDLC security suite'
        uses: subzone/ssdlc-action@v1.3.0
        with: 
          github-token: ${{ github.token }}
          ai-provider: github
          severity-threshold: medium
          enable-iac-scan: true
          enable-sast: true
          enable-sca: false
          fail-on-findings: false
          enable-secret-scan: true
          enable-ai-triage: true
          enable-ai-fix-suggestions: true
          sarif-upload: true 
      
      - name: 'Deploy PR stacks'
        run: |
          npx cdk deploy --all -c prNumber=${{ github.event.pull_request.number}} --require-approval never
          
      - name: 'Comment on PR'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: 'Infra validated!'
            })

  #Destroy PR stack on PR close
  destroy-pr-stack:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        
      - name: 'Configure AWS creds'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_PREVIEW_ROLE_ARN }}
          aws-region: 'ca-central-1'
        
      - name: 'Set up Node'
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json
      
      - name: 'Install dependencies'
        run: |
          npm ci

      - name: 'Destroy PR test stacks'
        run: |
          npx cdk destroy --all -c prNumber=${{ github.event.pull_request.number }} --require-approval never
      
    
         
  #Deploy     
  deploy:
    if: github.event_name == 'push' 
    needs: validate-pr
    runs-on: ubuntu-latest
    environment: production
    steps: 
      - name: 'Checkout'
        uses: actions/checkout@v4
        
      - name: 'Configure AWS creds'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{vars.AWS_DEPLOY_ROLE_ARN}}
          aws-region: 'ca-central-1'
        
      - name: 'Set up Node'
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json
      
      - name: 'Install dependencies'
        run: |
          npm ci
    
      - name: 'Deploy stacks'
        run: |
          npx cdk deploy --all --require-approval never
    
  
  